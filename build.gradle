import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
}

group 'com.waterloorocketry'
version '1.0-SNAPSHOT'

repositories {
    flatDir {
        dirs './'
    }
    mavenCentral()
}

dependencies {
    implementation name: 'OpenRocket-23.09', version: '23.09', group: 'net.sf.openrocket'


    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

test {
    useJUnitPlatform()
}

// Ensure the JAR includes the native library at the root
// This allows LibraryLoader.java to find it via getResource("/lib...")
sourceSets {
    main {
        resources {
            // Include the compiled native libraries
            srcDirs 'build/natives/lib'
            srcDirs 'build/natives/bin'
        }
    }
}

compileJava {
    options.compilerArgs += ['-h', file('src/main/include')]
}

task compileJNI {
    dependsOn compileJava

    doLast {
        def buildDir = file('build/natives')
        buildDir.mkdirs()

        // 1. Configure CMake (Platform Detection)
        exec {
            workingDir buildDir
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                // Windows: Use defaults (usually Visual Studio) or specify "MinGW Makefiles" if using MinGW
                commandLine 'cmake', '../..'
            } else {
                // Linux/Mac: Use Unix Makefiles
                commandLine 'cmake', '-G', 'Unix Makefiles', '../..'
            }
        }

        // 2. Build the native library using CMake's abstraction (works for Make, MSBuild, Ninja, etc.)
        exec {
            workingDir buildDir
            commandLine 'cmake', '--build', '.', '--config', 'Release'
        }
    }
}

clean.doFirst {
    delete fileTree('src/main/include') {
        include 'com_waterloorocketry_airbrakeplugin_jni_ProcessorCalculations*.h'
    }
}

// Ensure natives are compiled before processing resources (so they get added to the JAR)
processResources {
    dependsOn compileJNI
}

// OPTIONAL: Run task for testing inside Gradle
tasks.register('run', JavaExec) {
    dependsOn jar
    mainClass = 'net.sf.openrocket.startup.OpenRocket'
    classpath = files('./OpenRocket-23.09.jar', tasks.jar)
}

tasks.register('tune', JavaExec) {
    dependsOn jar
    mainClass = 'com.waterloorocketry.airbrakeplugin.PidTuner'
    classpath = files('./OpenRocket-23.09.jar', tasks.jar)
}